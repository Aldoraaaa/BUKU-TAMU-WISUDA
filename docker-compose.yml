services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestbook-backend:latest
    container_name: guestbook-backend
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
    volumes:
      - guestbook-db-data:/data
    networks:
      - appnet

  frontend:
    image: nginx:alpine
    container_name: guestbook-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  guestbook-db-data:
    name: guestbook-db-data

networks:
  appnet:
    name: appnet
    driver: bridge